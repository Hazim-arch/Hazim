[package]
name = "luner_os"
version = "0.1.0"
edition = "2024"
authors = ["Author Name Hazimuddin@outlook.com"]

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio"
]
test-success-exit-code = 33
test-timeout = 300  

[dependencies]
uart_16550 = "0.2.0"
bootloader = "0.9"
volatile = "0.2.6"
x86_64 = "0.14.2"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "LunerOS"
path = "src/main.rs"
test = true
bench = false

[[test]]
name = "should_panic"
harness = false