[package]
name = "luner_os"
version = "0.1.0"
edition = "2024"
authors = ["Author Name Hazimuddin@outlook.com"]

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-m", "256M",
    "-accel", "kvm",
    "-cpu", "host",
    "-vga", "std",
    "-display", "gtk,gl=on"
]
test-success-exit-code = 33
test-timeout = 300  

[dependencies]
pc-keyboard = "0.7.0"
uart_16550 = "0.2.0"
bootloader = "0.9"
pic8259 = "0.10.1"
volatile = "0.2.6"
x86_64 = "0.14.2"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "luner_os_bin"
path = "src/main.rs"
test = true
bench = false

[lib]
name = "luner_os"
path = "src/lib.rs"

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false